 TNA_administration_category:0 "Continental Administration"
 TNA_administration_category_desc:0 "We must embrace every socially useful function performed on the North American Continent, its active membership will be composed of all the people performing such functions in that area. Since there does not exist in this area any sequence of functions which is independent of, or can be isolated from, the remaining functions,it follows that in order to obtain the highly necessary synchronization and co-ordination between all the various functions they must all pyramid to a common head."

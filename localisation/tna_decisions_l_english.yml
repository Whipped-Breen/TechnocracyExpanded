 TNA_CAN_expand_civil_technocracy_support:0 "Expand Civil Support"
 TNA_CAN_expand_civil_technocracy_support_desc:1 "We must ensure the continuing spread of support for our cause among the people, and encourage them to publicly challenge the authority of the present government. As the position of the government is increasingly undermined and civil unrest continues to mount, it will become easier for us to achieve our goals. This holds especially true if, unlike a legal change in government, these goals involves a more... sinister means of regime change."
 TNA_CAN_open_up_political_discourse_technocracy:0 "Open Up Political Discourse"
 TNA_CAN_open_up_political_discourse_technocracy_desc:0 "We must open up the acceptance of diverging viewpoints in the government. Perhaps this will eventually make it possible to affect a peaceful change in the politics of [CAN.GetNameDef]."

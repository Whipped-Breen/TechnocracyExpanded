 TNA_europe_a_nation:0 "Europe a nation!"
 TNA_europe_a_nation_desc:0 "'Ask any child what is a nation? He will probably reply, a nation has a government. And in fact this is the right answer, for the first thing to note about a nation is that it is a country  consisting of a people with their own government. Many deeper reflections naturally follow; questions of geography, race, history, which contributed to the evolution of this fact, a people with a government which is a nation. But the simple, decisive point which defines a nation, is that it has a government.'"
 TNA_urbanates_category:0 "Urbanate Development"
 TNA_urbanates_category_desc:0 "We will build assembles of buildings in which people would live and work. These places would have all the facilities needed for a community, including schools, hospitals, shops, and public areas."

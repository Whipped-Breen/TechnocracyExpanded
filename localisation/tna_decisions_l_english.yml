 TNA_functional_sequences_category:0 "Functional Sequences"
 TNA_functional_sequences_category_desc:0 "The basic unit of this organization is the Functional Sequence. A Functional Sequence is one of the larger industrial or social units, the various parts of which are related one to the other in a direct functional sequence. Thus among the major Industrial Sequences we have transportation (railroads, waterways, airways, highways and pipe lines); communication (mail, telephone, telegraph, radio and television)."

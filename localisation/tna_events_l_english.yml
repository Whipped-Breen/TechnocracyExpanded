 teu.1.desc:0 "[USA.GetNameDef] are offering us to join their faction as the beacon of technocracy in Europe. We must take into account that we've been heavily aided by [TNA.GetNameDef]. What should we do?"
 teu.1.a:0 "For a better future"
 teu.1.b:0 "Is this a joke?"
 

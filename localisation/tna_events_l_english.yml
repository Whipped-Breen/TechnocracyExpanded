 teu.2.a:0 "For a better future"
 teu.2.b:0 "Who are they to harm sovereignity?"
 
 ###NEWS EVENTS###
 
 tech_news.001.t:0 "33nd President of the United States"
 tech_news.001.desc:0 "Howard Scott an American engineer and founder of Technocracy Incorporated has just been inaugurated as the 33nd president of the United States and Technocracy Incorporated replaced the Democrats as the leading political party in America. But it remains to be seen whether his ideology of 'Technocracy' can overcome the hardships of the great depression and secure peace and prosperity for America now and forever."
 tech_news.001.a:0 "An interesting development"
 tech_news.001.b:0 "Now and forever!"
 
 tech_news.002.t:0 "Establishment of the Technate of North America"
 tech_news.002.desc:0 "The Technocrats have finaly completed there plan for a pan North American superstate streching from the Beaufort Sea to the Northern Amazons, however it has yet to be seen whether such a linguistically and ethnically diverse nation can hold itself together and Technocracy Incorporated prove itself as worthy of governance."
 tech_news.002.a:0 "Good for them"
 tech_news.002.b:0 "For a prosperous tomorrow!"
 
 tech_news.004.t:0 "New Prime Minister of the United Kingdom"
 tech_news.004.desc:0 "Sir Oswald Ernald Mosley, 6th Baronet, leader of the British Union of Fascists has just been pronounced Prime Minister of the United Kingdom of Great Britain and Northern Ireland. But even though the change in govement was legitimate many non-fascists have taken to the streets to protest the new position of the controversial political figure. Communist Party of Great Britain has begun a commuist up-rising under Harry Pollitt in response to the development."
 tech_news.004.a:0 "Good luck..."
 tech_news.004.b:0 "1642!"
 tech_news.004.c:0 "Technocracy inc. wishes him well"
 
 tech_news.005.t:0 "British Civil War"
 tech_news.005.desc:0 "Sir Oswald Ernald Mosley, 6th Baronet, leader of the British Union of Fascists has just begun a fascist up-rising in the united kingdom, he is known for his dislike of war and the recent aid his movement has been geting, it is belived that a foreign power has orchestrated the event, most likely Nazi Germany."
 tech_news.005.a:0 "Oh well"
 tech_news.005.b:0 "For our country!"
 tech_news.005.c:0 "Technocracy inc. wishes him well"
 
 tech_news.006.t:0 "Pro-Roosevelt States Secede!"
 tech_news.006.desc:0 "After the removal of national elections the states of Texas, Mississippi, Alabama, Georgia, Arkansas and Louisiana has Seceded from the union under EX-US presedent Franklin D. Roosevelt, with the aim of reestablishing the democratic United States.\nBut with the majority of the American military under control of [USA.GetNameDef] it appears that the Technocrats victory is highly likely."
 tech_news.006.a:0 "What will this mean for America?"
 tech_news.006.b:0 "For a vast future!"
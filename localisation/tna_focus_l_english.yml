l_english:
 ###GOALS###
 tna_focus:0 "Technate of North America National Focus"
 TNA_scientific_revolution:0 "Uncle Sam in Gray"
 TNA_scientific_revolution_desc:0 ""We must start the scientific revolution and stop the deceitfulness of politicians by using engineers, doctors, teachers, economists, etc. in politics."
 TNA_encourage_decision_making:0 "Encourage Decision Making"
 TNA_encourage_decision_making_desc:0 "Instead of arguing about the nature of a decision, politicians have to evaluate the options and consequences of their decisions. This method can also be used in the military."
 TNA_STV:0 "STV"
 TNA_STV_desc:0 "Single Tranferable Vote voting system ensures better representation of citizens' opinions and the end of the established bipartidism. Let's ban the Electoral College!"
 TNA_minister_reform:0 "Cabinet Reform"
 TNA_minister_reform_desc:0 "The existence of a President electing the Cabinet is undemocratic. We need to change the system to elect ministers directly through sectional vote, subdivisions of the population related to a State concern."
 TNA_adapt_senate:0 "Adapt Senate"
 TNA_adapt_senate_desc:0 "By modifying Article 0, Section 3 of the American Constitution we can now fill up the Senate with experts, half selected through exams and half elected by ministers, thus allowing useful lawmaking."
 TNA_the_design:0 "The Design Act"
 TNA_the_design_desc:0 "The progress of these last few decades, that for the first time in human history, whole populations in certain geographical areas have changed over from a primary dependence upon agriculture for a livelihood to a primary dependence upon a technological mechanism, constructed principally from metals obtained from the minerals of the earth, and operated in the main from the energy contained in fossil fuels preserved within the earth."
 TNA_education_reform:0 "Education Reform"
 TNA_education_reform_desc:0 ""
 TNA_party_propaganda:0 "Party Propaganda"
 TNA_party_propaganda_desc:0 "We need to use the media to convince the population of the benefits of Technocracy."
 TNA_adopt_metric_system:0 "Adopt Metric System"
 TNA_adopt_metric_system_desc:0 "The Imperial System is ineffective. We need to adopt the internationally-used metric system."
 TNA_teknolohiya:0 "Teknolohiya"
 TNA_teknolohiya_desc:0 "The Republic of the Philippines has a non-technocratic goverment, this must end!"
 TNA_Tekunokurashi:0 "Tekunokurashi"
 TNA_Tekunokurashi_desc:0 "With the Surrender of Japan we must now move to secure the long term stability of the Japanese state and prosperity of its people."
 TNA_continental_research:0 "Continental Research"
 TNA_continental_research_desc:0 "To maintain an alert and active research for the development of new processes, equipment and products there must be continuous research in the fundamental sciences— physics, chemistry, geology, biology, etc."
 TNA_manhattan_project:0 "Manhattan Project"
 TNA_manhattan_project_desc:0 "Development of Substitute Materials, an innocent-sounding USACE project, will eventually be known as the Manhattan Project. One of the most secretive and dangerous undertakings in military history, its goal is to create the first atomic bomb."
 TNA_computing_machine:0 "The Computing Machine"
 TNA_computing_machine_desc:0 "In recent years a new technology has emerged, that of electronic computing, machines that can carry out thousands more calculations per second than any man, such a technology will be of great use in many research and military applications."
 TNA_research_sphere:0 "Research Sphere"
 TNA_research_sphere_desc:0 ""
 TNA_bilingual_schools:0 "Bilingual Nation"
 TNA_bilingual_schools_desc:0 "In order to fully integreat the anglophonic, francophonic and hispanophonic regions of North America we will install a bilingual education system and signs in order to facilitate cross-cultural communication."
 TNA_desegregate_the_armed_forces:0 "Desegregate the Armed Forces"
 TNA_desegregate_the_armed_forces_desc:0 "Serving under arms in the armed forces of one's country can be an unwelcome duty - but it can also be a cherished right. A right that many of our citizens are denied on account of their ancestry."
 
 TNA_energy_accounting:0 "Functional Sequences Act"
 TNA_energy_accounting_desc:0 "Free trade has failed. Let us begin a planned economy with the oversight of economists."
 TNA_new_timetables:0 "New Timetables"
 TNA_new_timetables_desc:0 "One of the first proposals of the Movement was to encourage efficiency in jobs through 4 hour per day, 4 day per week work."
 TNA_dynamic_command_economy:0 "Dynamic Command Economy"
 TNA_dynamic_command_economy_desc:0 "The Resources of this continent will be converted into goods and services for use only. Only that which is demanded by the people as through consumption will be produced."
 TNA_company_resource_management:0 "Company Resource Management"
 TNA_company_resource_management_desc:0 "We need to keep a close eye on the resources spent by companies to avoid the misuse of these resources."
 TNA_product_unit_standardization:0 "Product Unit Standardization"
 TNA_product_unit_standardization_desc:0 "By using commonly used units around the world in exports exchange is more appealing to foreign companies."
 TNA_protectionism:0 "Protectionism"
 TNA_protectionism_desc:0 "Tariffs will ensure the prosperity of the domestic industry."
 TNA_closed_economy:0 "Closed Economy"
 TNA_closed_economy_desc:0 "There's an increasing need of self-sufficiency in the economy in order to avoid future a global economic crisis."
 TNA_limited_exports:0 "Limited Exports"
 TNA_limited_exports_desc:0 "There's an increasing need of self-sufficiency in the economy in order to avoid future a global economic crisis."
 TNA_prospect:0 "Prospect for Resources"
 TNA_prospect_desc:0 "Once most of foreign trade is limited we need to find new resources to run the industry of the country."
 TNA_state_industry:0 "State Industry"
 TNA_state_industry_desc:0 "State-built industry allows work for the unemployed thus revitalizing the economy, much like the proposed New Deal."
 TNA_continuous_energy_registration:0 "Continuous Energy Registration"
 TNA_continuous_energy_registration_desc:0 "The Technate must register on a continuous 24-hour-per day basis, the total net conversion of energy, which would determine (a) the availability of energy for Continental plant construction and maintenance, (b) the amount of physical wealth available in the form of consumable goods and services for consumption by the total population during the balance-load period."
 TNA_production_consumption_monitoring:0 "Production-Consumption Monitoring"
 TNA_production_consumption_monitoring_desc:0 "Provide a continuous inventory of all production and consumption. Provide a specific registration of the type, kind, etc., of all goods and services, where produced, and where used."
 TNA_urbanates:0 "Urbanates"
 TNA_urbanates_desc:0 "We will build assembles of buildings in which people would live and work. These places would have all the facilities needed for a community, including schools, hospitals, shops, and public areas."
 TNA_adopt_joule:0 "Adopt The Joule"
 TNA_adopt_joule_desc:0 "It's through the adaptation of the Joule as an energy currency when speculation disappears completely."
 TNA_rubber:0 "Rubber Production"
 TNA_rubber_desc:0 "One of the only resources the State is lacking is rubber, which is more abundant in tropical and subtropical areas. We can start the production in the Yucatán Peninsula."
 TNA_north_american_railroad:0 "North American Railroad"
 TNA_north_american_railroad_desc:0 "Many states in the rocky mountain region lack sufficient infrastructure levels so they must be improved!"
 TNA_neotropical_road:0 "The Neotropical Road"
 TNA_neotropical_road_desc:0 "The industry of Latin America is lacking behind the of the contanental US, so to rectify we will commence an infrastructure project across the region."
 TNA_continental_hydrology:0 "Continental Hydrology"
 TNA_continental_hydrology_desc:0 "A Continental Design for flood and erosion control, and water for power, irrigation, transportation, recreation, and climate modification."
 TNA_continental_design:0 "Build the Continental Design"
 TNA_continental_design_desc:0 ""
 TNA_continental_power:0 "Power for A Continent"
 TNA_continental_power_desc:0 ""
 TNA_tachnate_science:0 "Science Across the Tachnate"
 TNA_tachnate_science_desc:0 ""

 TNA_scott_doctrine:0 "Foreign Relations"
 TNA_scott_doctrine_desc:0 "In order to set up a self-sufficient country we first need the natural resources to maintain it. North America is bountiful and thus we need to create a nation that encompasses the continent. The strategy might be dreadful but it's for the greater good."
 TNA_mexico:0 "Mexico"
 TNA_mexico_desc:0 "Mexico lies just south of us like a wall that stops us from having access to Central America. We can ask them if they want to join the cause or face consequences."
 TNA_central_america:0 "Central America"
 TNA_central_america_desc:0 "Central America is the next step for unifying the continent. We can ask them if they want to join the cause or face consequences."
 TNA_south:0 "The South"
 TNA_south_desc:0 "The South is very rich in oil and the last step for annexing the latin countries. We can ask them if they want to join the cause or face consequences."
 TNA_technocracy_in_canada:0 "Technocracy In Canada"
 TNA_technocracy_in_canada_desc:0 "In order to assimilate Canada we must first win over there trust and support."
 TNA_canada:0 "Canada"
 TNA_canada_desc:0 "Canada already has significant support for our movement. We can take advantage of a war in Europe to reqest the transference of Canada's loyalty to us."
 TNA_british_caribbean:0 "Destroyers for Caribbean"
 TNA_british_caribbean_desc:0 "With the British preoccupied with the war in Europe we can take control of the British West Indies considering their resources are being spent on fighting taking them off their hands shouldn't be to hard."
 TNA_dutch_america:0 "Dutch America"
 TNA_dutch_america_desc:0 "We can seize this land without having to send an ultimatum since they don't even have an army to defend it."
 TNA_danish_america:0 "Danish America"
 TNA_danish_america_desc:0 "We can seize this land without having to send an ultimatum since they don't even have an army to defend it."
 TNA_french_america:0 "French America"
 TNA_french_america_desc:0 "We can seize this land without having to send an ultimatum since they don't even have an army to defend it."
 TNA_north_american_technate:0 "Technate of North America"
 TNA_north_american_technate_desc:0 "After all said and done, after fighting and accepting treaties, after threatening and promising; the day has come. A day to be remembered in history, a day in which the Technate of North America will be the new superpower. And after this day every nation will remember what led to the creation of this prosperous country."
 
 TNA_mosley_plot:0 "The Mosley Plot"
 TNA_mosley_plot_desc:0 "We can start supporting Oswald Mosley, fascist politician in Britain, to undermine the government for our future projects. But first, we need to convince Mosley of our ideals since his ideology leans towards technocracy."
 TNA_man_of_action:0 "A new man of action"
 TNA_man_of_action_desc:0 "'Great men of action never mind on occasion being ridiculous; in a sense it is part of their job.'"
 TNA_mosley_coup:0 "The Mosley Coup"
 TNA_mosley_coup_desc:0 "With the current war against the Axis, Mosley can easily try to get in power of Britain. We just need to tell him when."
 TNA_coerce_mosley:0 "Coerce Mosley"
 TNA_coerce_mosley_desc:0 "Once Mosley is content we can simply ask him to oficially join the cause. If he's not willing, we'll have to take violence into action."
 TNA_pacific_technate:0 "Pacific Interests"
 TNA_pacific_technate_desc:0 "With the colonies in the Pacific in ruins and Japan under our control it is time to secure the destiny of war-torn states, With Australia and Japan serving as its scientific and industral base and the islands in-between as its source of resources and manpower."
 TNA_technate_of_europe:0 "Technocracy in Europe"
 TNA_technate_of_europe_desc:0 "With Europe in ruins we canot help but have pity on the continent, we will help in the reconstruction processes and in the building of the European Technate!"
 
 TNA_war_plans_division:1 "War Plans Division"
 TNA_war_plans_division_desc:1 "While we might desire peace, we must prepare for war."
 TNA_intervention_in_the_americas:1 "Intervention in the Americas"
 TNA_intervention_in_the_americas_desc:1 "Our first order of business must be to ensure we are prepared for any eventuality in our own hemisphere."
 TNA_war_plan_green:1 "War Plan Green"
 TNA_war_plan_green_desc:1 "With Mexico in a constant state of instability following the revolution, we must be prepared to intervene, decisively."
 TNA_war_plan_crimson:1 "War Plan Crimson"
 TNA_war_plan_crimson_desc:1 "While Canada may be a friendly neighbor now, this may not always be the case."
 TNA_war_plan_gray:1 "War Plan Gray"
 TNA_war_plan_gray_desc:1 "History has shown that the nations of the Caribbean are quite unstable. We might have to move quickly to protect American interests should any of them fall into instability."
 TNA_reinforce_monroe_doctrine:0 "Reaffirm Monroe Doctrine"
 TNA_reinforce_monroe_doctrine_desc:0 "Dating over a 100 years back, the Monroe Doctrine codified US intervention in the case of European attempts to colonize the Americas, but stay out of European affairs. Strengthening our role as peace-keepers on these continents will improve our influence in the region."
 TNA_pan_america:0 "South American Dominance"
 TNA_pan_america_desc:0 "The peace in America must be kept. We have the strength to ensure that petty squabbles between neighboring nation do not escalate. A war at our doorsteps is exactly what our enemies want, and we must do everything we can to prevent it."
 TNA_intervention_in_europe:1 "Intervention in Europe"
 TNA_intervention_in_europe_desc:1 "Less than two decades after the end of the Great War, the nations of Europe are once again poised for war. We must be prepared in case the situation requires swift intervention."
 TNA_war_plan_gold:1 "War Plan Gold"
 TNA_war_plan_gold_desc:1 "France suffers from internal division and increasing political radicalism, but is also one of the greatest military powers of Europe. This combination makes many people uncomfortable."
 TNA_war_plan_silver:0 "War Plan Silver"
 TNA_war_plan_silver_desc:0 "Italy has openly declared its ambition to rule the Mediterranean. If their desires of an Empire conflict with our interests, we must be prepared."
 TNA_anti_bolshevist_aid:1 "Anti Bolshevist Aid"
 TNA_anti_bolshevist_aid_desc:1 "Any gun, shell, bullet and pair of boots we can give to those fighting the spread of communism will ultimately help defend us."
 TNA_war_plan_ruby:1 "War Plan Ruby"
 TNA_war_plan_ruby_desc:1 "India houses untold millions of people, which we must be prepared to face should we come into conflict."
 TNA_war_plan_scarlet_garnet:1 "War Plan Scarlet Garnet"
 TNA_war_plan_scarlet_garnet_desc:1 "In the Pacific, Australia and New Zealand may well come to the aid of their motherland. Any plan to deal with Britain must account for her colonies."
 TNA_intervention_in_asia:1 "Intervention In Asia"
 TNA_intervention_in_asia_desc:1 "Often overshadowed by the developments in Europe, Asia has its own trouble spots, forcing us to prepare for an intervention."
 TNA_war_plan_yellow:1 "War Plan Yellow"
 TNA_war_plan_yellow_desc:1 "China has been in a state of civil war for more than a generation. There is no telling when the situation deteriorates to the point where we have to intervene."
 TNA_war_plan_black:0 "War Plan Black"
 TNA_war_plan_black_desc:0 "It's plain to see that Germany's politics and expansionism goes far beyond any measure of sanity. They must be stopped before their war machine reaches the point of no return."
 TNA_war_plan_white:0 "War Plan White"
 TNA_war_plan_white_desc:0 "The Red Menace cannot be allowed to expand unchecked. Whether from without or from within, there is no greater threat to our nation and the world at large."
 TNA_war_plan_red:0 "War Plan Red"
 TNA_war_plan_red_desc:0 "After appearing to be on the path to respecting the people, our old oppressors are now at odds with the winds of change we've accepted. The British Empire is showing its true colors. We must let them know where we stand."
 TNA_war_plan_orange:0 "War Plan Orange"
 TNA_war_plan_orange_desc:0 "There is no greater threat to us than Japan's imperialistic ambitions. Their efforts to expand into Asia and the Pacific will put them at odds with our interests quickly."
 TNA_defense_of_the_pacific:0 "Defense of the Pacific"
 TNA_defense_of_the_pacific_desc:0 "The Japanese government is beyond hope, its expansionism threatening both our people and its Asian neighbors. The nation must be brought under American administration to reform it and prevent it from ever repeating its mistakes."
 
 TNA_war_department:1 "Armed Forces"
 TNA_war_department_desc:0 "In an age of industrialized warfare, we must have an administration capable of harnessing the resources of our great nation to their fullest potential."
 TNA_selective_training_act:0 "Selective Training Act"
 TNA_selective_training_act_desc:0 "The United States has historically been slow to adopt a draft, even in times of war. We are no longer able to afford this luxury."
 TNA_louisiana_maneuvers:0 "Louisiana Maneuvers"
 TNA_louisiana_maneuvers_desc:0 "Budget constraints have forced us to observe many military developments from afar. Now, we can finally try out some of our theories in practice."
 TNA_department_of_defense:0 "Continental Security"
 TNA_department_of_defense_desc:0 "Renaming the Armed Forces underlines that we can no longer choose to ignore our protection until the moment it is tested. We must always be vigilant."
 TNA_improved_training:0 "Improved Training"
 TNA_improved_training_desc:0 "All effectives, male and female, between the ages of 18 and 65, shall be conscripted by the Technate of America for national service."
 TNA_airborne_divisions:0 "Airborne Divisions"
 TNA_airborne_divisions_desc:0 "The developments in the range and payload of planes have opened up a number of possibilities. Cargo planes could deliver a full division of troops far behind enemy lines, where they would wreak havoc."
 TNA_army_of_the_united_states:0 "Army of [ROOT.GetNameDef]"
 TNA_army_of_the_united_states_desc:0 "For the fights that are to come, the [ROOT.GetNameDef] Army is too small. To oversee the dramatic increase in size we will have to accomplish, we will need to create a new organization"
 TNA_womens_armed_service_integration_act:0 "Women's Armed Service Integration Act"
 TNA_womens_armed_service_integration_act_desc:0 "We can not afford to turn away anyone who wishes to serve. Every woman in uniform frees up a man to fight at the front."
 TNA_tank_experiments:0 "Tank Experiments"
 TNA_tank_experiments_desc:0 "Tanks are indispensable on the modern battlefield. We must find out how to best utilize them."
 TNA_tank_destroyer_doctrine:0 "Tank Destroyer Doctrine"
 TNA_tank_destroyer_doctrine_desc:0 "A controversial theory developed by some artillery officers, claiming that the best weapon against armored breakthroughs is a fast, lightly armored but heavily armed vehicle."
 TNA_main_battle_tanks:0 "Main Battle Tanks"
 TNA_main_battle_tanks_desc:0 "Experience in the field has clearly shown that a tank must be able to perform a large number of tasks, from infantry support to fighting enemy tanks. Designing vehicles to meet these needs allows us to streamline production."
 TNA_armored_infantry:0 "Armored Infantry"
 TNA_armored_infantry_desc:0 "Tanks alone can not win a battle. It takes infantry to hold territory. Providing them with armored vehicles allows them to keep up with the tanks and survive anything thrown at them."
 TNA_build_the_pentagon:0 "Build the Pentagon"
 TNA_build_the_pentagon_desc:0 "The expansion of our military requires a new global headquarters to command it."
 TNA_department_of_defense:0 "Department of Defense"
 TNA_department_of_defense_desc:0 "Renaming the war department underlines that we can no longer choose to ignore our protection until the moment it is tested. We must always be vigilant."
 TNA_escort_fighters:0 "Escort Fighters"
 TNA_escort_fighters_desc:0 "While the bomber might always get through, his wingman might not - unless they are both protected by friendly fighters."
 TNA_us_army_airforce:0 "[Root.GetUsArmyAirForceUSMC]"
 TNA_US_ARMY_AIRFORCE_STATES:0 "US Army Airforce"
 TNA_US_ARMY_AIRFORCE_TECHNATE:0 "TNA Army Airforce"
 TNA_us_army_airforce_desc:0 "The fundamental objective of military airpower is to allow the ground forces to take and hold ground. Everything else is ancillary."
 TNA_us_air_force:0 "[Root.GetUsAirForce]"
 TNA_US_AIR_FORCE_STATES:0 "US Air Force"
 TNA_US_AIR_FORCE_TECHNATE:0 "TNA Air Force"
 TNA_us_air_force_desc:0 "The fundamental objective of military airpower is to win wars. Strategic bombing with ever more devastating weapons will either break the will of the enemy to resist or render them materially unable to do so."
 TNA_two_ocean_navy_act:0 "Two Ocean Navy Act"
 TNA_two_ocean_navy_act_desc:0 "With war on the horizon, we must ensure that no enemy can ever set foot on American shores. Our navy must be able to fight any enemy in either of the two great oceans that form our borders."
 TNA_maritime_commission:0 "Maritime Commission"
 TNA_maritime_commission_desc:0 "While most laymen only focus on the warships, the true experts know that it is the humble cargo vessel that wins wars. To increase the amount of shipping available in times of war, we will form a special board to coordinate construction."
 TNA_advanced_basing:0 "Advanced Basing"
 TNA_advanced_basing_desc:0 "The further we can keep the enemy from our shores, the better."
 TNA_naval_radar:0 "Naval Radar"
 TNA_naval_radar_desc:0 "Radar offers tantalizing possibilities to take the cover of night away from our enemies and detect them even in bad weather."
 TNA_fleet_submarines:0 "Fleet Submarines"
 TNA_fleet_submarines_desc:0 "Our most likely opponents in the naval war both rely on foreign trade, which has shown to be very vulnerable to submarines. These submarines would have to have very long range to allow them to cross the oceans and operate close to the enemy shore."
 TNA_unrestricted_submarine_warfare:0 "Unrestricted Submarine Warfare"
 TNA_unrestricted_submarine_warfare_desc:0 "History has shown that whatever well-intentioned treaty tried to control submarine warfare is not worth the paper it is written on. We should not consider ourselves bound by something our enemies will ignore anyway."
 TNA_first_special_service_force:0 "First Special Service Force"
 TNA_first_special_service_force_desc:0 "Operations behind enemy lines in inhospitable territory will be part of any global conflict. Forming commando units to fulfill these roles is essential to our future warfare."
 TNA_support_rock_island:0 "Support Rock Island"
 TNA_support_rock_island_desc:0 "Supporting our brave troops in any way we can is key to victory. Be that by laying down heavy artillery fire from a distance or more direct support on the battlefield. We must make sure our troops have everything they need."
 TNA_air_war_plans_division:0 "Air War Plans Division"
 TNA_air_war_plans_division_desc:0 "To make the right priorities in aviation as well as aircraft production will require long-term planning. The AWPD will ensure we have materiel, organization and strategic plans."
 TNA_air_support:0 "Air Support"
 TNA_air_support_desc:0 "Aerial warfare must first and foremost be used in conjunction with other military operations."
 TNA_strategic_bombing:0 "Strategic Bombing"
 TNA_strategic_bombing_desc:0 "The capacity to execute precision bombing will allow us to stop the war machine of any nation in its tracks."
 TNA_TAC:0 "Tactical Bomber Effort"
 TNA_TAC_desc:0 "Constructing planes built to attack tactical targets will make way for our troops to advance more safely."
 TNA_combined_bomber_offensive:0 "Combined Bomber Offensive"
 TNA_combined_bomber_offensive_desc:0 "With another Great Power on our side, we have unexpected advantages in researching and applying large-scale offensive bombing."
 TNA_lockheed_P_80:0 "Lockheed P-80"
 TNA_lockheed_P_80_desc:0 "The future of aviation does not lie with propellors. We must look at jet propulsion for improved capabilities for our aircraft."
 TNA_fund_the_navy:0 "[Root.GetFundTheNavy]"
 TNA_FUND_THE_NAVY_PRICE:0 "Fund The Navy"
 TNA_FUND_THE_NAVY_ENERGY:0 "Develop The Navy"
 TNA_fund_the_navy_desc:0 "We must be able to adapt to anything new our enemies throws at us. Increased funding to navy exercises will lead to a more efficient navy that can tactically outperform our enemies."
 TNA_naval_engineering_industrial_function:0 "Naval Engineering Industrial Function"
 TNA_naval_engineering_industrial_function_desc:0 "We will combine the Bureau of Construction and Repair and the Bureau of Engineering into one entity to oversee future naval developments."
 TNA_battleship_primacy:0 "Battleship Primacy"
 TNA_battleship_primacy_desc:0 "With the Japanese denounciation of the Washington Naval Treaty, we may face another arms race on the oceans. We will ensure we have both the most and best battleships."
 TNA_advanced_mahanian_doctrine:0 "Advanced Mahanian Doctrine"
 TNA_advanced_mahanian_doctrine_desc:0 "The influence of Alfred Thayer Mahan on naval warfare can hardly be underestimated. Building on his work will allow us to make good use of battleships, which he considered a decisive factor."
 TNA_carrier_primacy:0 "Carrier Primacy"
 TNA_carrier_primacy_desc:0 "Air power will be needed in battles to come, and the most practical means of extending its range is the use of aircraft carriers. We must create more advanced and specialized models."
 TNA_bureau_of_aeronautics:0 "Naval Aviation"
 TNA_bureau_of_aeronautics_desc:0 "To meet the needs for naval aviation development, the Bureau of Aeronautics, which has been responsible for these matters for decades, will have to be expanded."
 TNA_escort_effort:0 "Escort Effort"
 TNA_escort_effort_desc:0 "Submarines constitute a danger to our merchant convoys. Focusing on development of new destroyer models will allow us to wage anti-submarine warfare efficiently."
 TNA_convoy_tactics:0 "Convoy Tactics"
 TNA_convoy_tactics_desc:0 "Protecting our trade vessels is not just about escorts and effective intelligence, but also tactical choices in how to arrange our trade routes and routines."
 TNA_amphibious_operations:0 "Amphibious Operations"
 TNA_amphibious_operations_desc:0 "Unless our worst nightmares come true, this war will not be ended on American soil. Well-executed landings will need to be part of the path to victory."
 TNA_expand_the_USMC:0 "[Root.GetExpandTheUSMC]"
 TNA_EXPAND_THE_USMC_STATES:0 "Expand The USMC"
 TNA_EXPAND_THE_USMC_TECHNATE:0 "Expand The TNMC"
 TNA_expand_the_USMC_desc:0 "[Root.GetExpandTheUSMCDesc]" 
 TNA_EXPAND_THE_USMC_DESC_STATES:0 "The United States Marine Corps have been a decisive force in many past wars and may be more relevant than ever for our amphibious campaigns. Semper fidelis!"
 TNA_EXPAND_THE_USMC_DESC_TECHNATE:0 "The Technate of North America Marine Corps have been a decisive force in many past wars and may be more relevant than ever for our amphibious campaigns. Semper fidelis!"
 TNA_liberty_ships:0 "Liberty Ships"
 TNA_liberty_ships_desc:0 "Mass-production of cargo ships need to accompany our industrial developments to ensure our materials and troops reach the theaters where they are needed."
 TNA_total_conscription:0 "Total Conscription!"
 TNA_total_conscription_desc:0 "We cannot achieve a fighting national morale and internal efficiency while some Americans gain wealth and economic advantage in war prices, war profits, war wages, and war racketeering thought the spilling of blood of other Americans in defense of the country."
 TNA_m_day:0 "M Day"
 TNA_m_day_desc:0 "The three 'Ms'-Men, Machines and Materiel are necessary for complet national mobilizaion."

 TNA_research_sphere_name:0 "Research Sphere"
 TNA_research_sphere_desc:0 "An intertechnate research organisation."

 ###OPINION MODIFIERS###
 seized_land_during_war:0 "Seized land during war"
 pan_america:1 "Pan America"
 
 ###MISC###
 autonomous_tna_state:0 "Technate Autonomous Zone"
 self_governing_district:0 "Self-Governing District"
 canada_support_tt:0 "Our suppot in [CAN.GetNameDef] (§Y[?can.tech_popularity]%§!) is greater than or equal to §Y[?can.check_popularity]%§!"